about    = "Logistics hub for the western Canadian Arctic; most Mackenzie Delta campaigns stage through its airport."
about_de = "Logistikzentrum der westkanadischen Arktis; die meisten Kampagnen im Mackenzie-Delta starten über den Flughafen."

