# Places: post offices, field sites and collectors' towns.
#
# Every letter points at a place by its key instead of repeating coordinates,
# so a position is corrected in one spot and every letter follows.
#
#   name       shown in the interface (name_de only where German differs)
#   kind       office | site | town
#   lat/lon    decimal degrees, north and east positive
#   country    optional
#   about      one or two sentences, shown when the place is followed
#
# Translations: any text field can have a _de sibling directly beneath it.
# A missing one falls back to English and is listed by the build.

[tuktoyaktuk]
name     = "Tuktoyaktuk, Northwest Territories"
name_de  = "Tuktoyaktuk, Nordwest-Territorien"
kind     = "office"
lat      = 69.445
lon      = -133.034
about    = "Hamlet on the Beaufort Sea coast, the northern end of the Dempster Highway and the usual mailing point for fieldwork on the outer Mackenzie Delta."
about_de = "Siedlung an der Beaufortsee, nördliches Ende des Dempster Highway und die übliche Poststelle für Feldarbeit im äußeren Mackenzie-Delta."

