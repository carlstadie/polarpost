# Field notes: what the team wrote on the cover by hand — a heading, a line
# about the work, sometimes a whole paragraph. The writing is the content, so it
# is transcribed exactly and never translated in place.
#
#   name            a short name for the note, usually its first line
#   expedition      key from expeditions.toml
#   colour          the pen
#   shows           where on the cover it is and what it covers, in a sentence
#   transcript      the writing, line for line, exactly as written
#   transcript_lang the language the hand wrote in: "en" or "de"
#   translation     English rendering, shown when the reader is not reading in
#                   the transcript's language. translation_de likewise, for an
#                   English transcript read in German.
#   verify          true while anything here is still unchecked

[duccem-2026]
name            = "DUCCEM 2026, Summer Expedition, Land-to-Ocean"
expedition      = "duccem-2026"
colour          = "Blue ballpoint"
colour_de       = "Blauer Kugelschreiber"
shows           = "The expedition name and the words Summer Expedition and Land-to-Ocean, written across the upper left of the cover by hand."
shows_de        = "Der Expeditionsname und die Worte Summer Expedition und Land-to-Ocean, von Hand oben links auf den Umschlag geschrieben."
transcript_lang = "en"
transcript      = """
DUCCEM 2026
Summer Expedition
Land-to-Ocean
"""
translation_de  = """
DUCCEM 2026, Sommerexpedition, vom Land ins Meer.
"""


