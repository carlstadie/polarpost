# Expeditions.
#
# One entry per campaign. Letters reference it with `expedition = "<key>"`,
# and a cachet in cachets.toml points back here with `expedition = "<key>"`.
#
#   name      full name as the team writes it (name_de only if it differs)
#   operator  institute or consortium
#   season    when it ran, in words
#   region    where, in words
#   topic     one or two sentences on the science
#   sites     keys from places.toml
#   link      optional project page
#   verify    true while anything here is still unchecked

[yukon-coast-2026]
name        = "Expedition Yukon Coast 2026"
operator    = "Alfred Wegener Institute"
operator_de = "Alfred-Wegener-Institut"
season      = "Summer 2026"
season_de   = "Sommer 2026"
region      = "Hershel Island and Tuktoyaktuk, Northwest Territories, Canada"
region_de   = "Herschel Island und Tuktoyaktuk, Nordwest-Territorien, Kanada"
topic       = "Coastal permafrost erosion on Herchel Island and the coastal hamlet of Tuktoyaktuk, Northwest Territories, Canada."
topic_de    = "Küstenerosion von Permafrost auf der Herschel-Insel und in der Küstensiedlung Tuktoyaktuk, Nordwest-Territorien, Kanada."
sites       = ["qikiqtaruk", "tuktoyaktuk", "inuvik"]
#verify      = true

