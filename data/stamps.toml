[fi-priority-lake]
country         = "Finland"
country_de      = "Finnland"
value           = "Priority, non-denominated"
value_de        = "Priority, ohne Wertangabe"
title           = "Glow of the Sun"
title_de        = "Glow of the Sun"
commemorates    = "Jukka Risikko photographed these stamps glowing with the first rays of the morning sun. The stamps feature cottongrass by the edge of a marsh in Alajoki, Lapua, and a lakeside landscape in Orisberg, Isokyrö. The graphic design of the stamps was created by Stiina Hovi."
commemorates_de = "Jukka Risikko fotografierte diese Marken im ersten Licht der Morgensonne. Die Marken zeigen Wollgras am Rand eines Sumpfes in Alajoki, Lapua, und eine Landschaft am See in Orisberg, Isokyrö. Das Grafikdesign der Marken stammt von Stiina Hovi."

