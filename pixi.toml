# Run Polarpost with pixi (https://pixi.sh). Pixi installs its own Python and
# Pillow for this folder only, so nothing else on your machine is touched.
#
#   pixi run start     build, serve at http://localhost:8777, rebuild and reload on save
#   pixi run build     only rebuild, e.g. in a second window after editing data
#   pixi run boxes     rebuild and write proof sheets of the mark boxes to proofs/
#
# Re-bundling d3 (rarely needed) has its own environment with Node:
#   pixi run -e vendor vendor

[workspace]
name = "polarpost"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[dependencies]
python = ">=3.11"
pillow = "*"

[tasks]
build = "python build.py"
boxes = "python build.py --boxes"
start = "python scripts/serve.py"

[feature.vendor.dependencies]
nodejs = ">=20"

[feature.vendor.tasks]
vendor = "npm install && npm run vendor"

[environments]
vendor = ["vendor"]
