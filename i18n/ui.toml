# ── the catalogue panel ─────────────────────────────────────────────────────
["overview.title"]
en = "Polar Letters"
de = "Post aus den Polarregionen"

["overview.intro"]
en = "There is and age-old tradition at the Alfred Wegener Institute. On each Expedition, we carry letters from polar philatelists, to be send back to them. Each letter tells a story; about the expedition, who was on it, and of course the special stamps and postmarks that were used. Here, for a first time, you can access these collections and stories digitally. Open a letter and follow everything on it."
de = "Am Alfred-Wegener-Institut gibt es eine alte Tradition. Auf jeder Expedition werden Briefe von Polarphilatelisten mitgenommen, um sie an diese zurückzusenden. Jeder Brief erzählt eine Geschichte; über die Expedition, wer daran teilgenommen hat und natürlich über die besonderen Briefmarken und Stempel, die verwendet wurden. Hier können Sie erstmals auf diese Sammlungen und Geschichten digital zugreifen. Öffnen Sie einen Brief und verfolgen Sie alles darauf."

["overview.filtered"]
