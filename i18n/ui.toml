# Every piece of interface text, in every language, side by side.
#
# One table per string. The key is what the code asks for — t("stats.letters") —
# and each language is a line underneath. Adding a language means adding one
# line to each table and its code to [i18n] languages in config.toml; the build
# stops and names any table that is missing it.
#
# {name}-style placeholders are filled in by the code. Keep them in every
# language, though their position in the sentence may move.
#
# Strings that end in _one / _many are picked by count: "1 letter" / "3 letters".

