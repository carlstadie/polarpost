# Build the site from the TOML sources and publish it to GitHub Pages.
#
# The build is the same `python3 build.py` you run locally, so the privacy
# checks run on every push: an unconsented collector, an address field in a
# letter, or an oversized scan fails the job and nothing is published.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:                  # one deploy at a time; a newer push wins
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"      # 3.11+ for tomllib in the standard library

      - run: pip install pillow

      - name: Build
        run: python3 build.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4
        id: deployment
